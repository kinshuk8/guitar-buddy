name: fretlight
description: "A new Flutter project."
publish_to: 'none'
version: 0.9.1+10

environment:
  sdk: ^3.13.7

dependencies:
  audio_session: ^0.2.4
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  file_picker: ^13.3.2
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_soloud: ^5.2.2
  go_router: ^18.1.2
  meta: ^1.19.0
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  record: ^7.1.2
  sqlite3: ^3.8.0
  wakelock_plus: ^1.8.2
dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true

  fonts:
    # Variable font (wght 100-900, opsz 14-32). Weights are applied through
    # FontVariation in theme.dart, so one file covers every style.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf

  assets:
    - assets/fonts/Inter-OFL.txt
    - assets/chords/guitar.json
    - assets/chords/chords-db-LICENSE.txt
    - assets/songs/
    # Optional data pack (CC BY-NC 4.0). Remove this line and the folder to ship without it.
    - assets/packs/chordonomicon/
